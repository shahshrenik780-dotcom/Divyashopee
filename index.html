<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Shopee - Complete Catalog</title>
    <style>
        /* Styling wahi hai jo aapko pasand aayi thi */
        body { font-family: sans-serif; background: #f8fafc; padding: 10px; margin: 0; }
        h1 { text-align: center; color: #1e293b; margin-bottom: 20px; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 500px; margin: 0 auto 20px; }
        .cat-btn { background: #2563eb; color: white; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .cat-btn.all-cat { background: #0f172a; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; max-width: 1200px; margin: auto; }
        .card { background: white; padding: 12px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .slider-container { position: relative; width: 100%; overflow: hidden; border-radius: 8px; }
        .slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .slider::-webkit-scrollbar { display: none; }
        .slider img { width: 100%; height: 280px; object-fit: cover; scroll-snap-align: start; flex: 0 0 100%; cursor: pointer; }
        .dots { display: flex; justify-content: center; gap: 5px; margin: 8px 0; }
        .dot { width: 6px; height: 6px; background: #cbd5e1; border-radius: 50%; }
        .dot.active { background: #1e293b; width: 16px; border-radius: 3px; }
        .name { font-weight: bold; margin: 8px 0; }
        .price { color: #16a34a; font-weight: bold; }
        .mrp { color: #94a3b8; text-decoration: line-through; margin-left: 8px; }
        .btn-order { display: block; background: #25d366; color: white; padding: 10px; text-align: center; border-radius: 6px; text-decoration: none; margin-top: 10px; font-weight: bold; }
        .btn-share { display: block; background: #64748b; color: white; padding: 8px; text-align: center; border-radius: 6px; text-decoration: none; margin-top: 8px; cursor: pointer; border: none; width: 100%; }
        
        /* Modal (Popup) */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        #modal img { max-width: 90%; max-height: 80%; object-fit: contain; }
        #close-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Divya Shopee</h1>
    <div class="category-grid" id="category-buttons"></div>
    <div class="product-grid" id="catalog"></div>

    <div id="modal" onclick="closeModal()">
        <span id="close-btn">&times;</span>
        <img id="modal-img" src="">
    </div>

    <script>
        const sheetId = '1PDHNxST-LElVwOmtpmnBeF6z1AAPifzEF_sbNpAabdA';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
        let allProducts = [];

        fetch(url).then(res => res.text()).then(text => {
            const data = JSON.parse(text.substr(47).slice(0, -2));
            let cats = new Set();
            data.table.rows.forEach(row => {
                if(!row.c[0]?.v) return;
                const p = {
                    name: row.c[0].v, mrp: row.c[1]?.v, price: row.c[2]?.v,
                    photos: [row.c[5], row.c[6], row.c[7], row.c[8], row.c[9]].filter(x => x?.v).map(x => x.v),
                    category: row.c[10]?.v?.trim() || 'Other'
                };
                allProducts.push(p);
                cats.add(p.category);
            });
            renderCats(Array.from(cats));
            renderProducts('ALL');
        });

        function renderCats(cats) {
            const container = document.getElementById('category-buttons');
            cats.forEach(c => container.innerHTML += `<button class="cat-btn" onclick="renderProducts('${c}')">${c}</button>`);
            container.innerHTML += `<button class="cat-btn all-cat" onclick="renderProducts('ALL')">All</button>`;
        }

        function renderProducts(cat) {
            const container = document.getElementById('catalog');
            container.innerHTML = '';
            const filtered = (cat === 'ALL') ? allProducts : allProducts.filter(p => p.category === cat);
            
            filtered.forEach((p, idx) => {
                let slides = p.photos.map(src => `<img src="${src}" onclick="openModal('${src}')">`).join('');
                container.innerHTML += `
                    <div class="card">
                        <div class="slider-container"><div class="slider">${slides}</div></div>
                        <div class="name">${p.name}</div>
                        <div><span class="price">₹${p.price}</span><span class="mrp">₹${p.mrp}</span></div>
                        <a href="https://wa.me/919998366986?text=Order: ${p.name}" class="btn-order" target="_blank">Order on WhatsApp</a>
                        <button class="btn-share" onclick="shareProd('${p.name}', '${p.price}', '${p.mrp}')">Share Product</button>
                    </div>`;
            });
        }

        function openModal(src) { document.getElementById('modal-img').src = src; document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function shareProd(name, p, m) {
            const msg = `*Product:* ${name}\n*Price:* ₹${p} (MRP: ₹${m})\n*View:* ${window.location.href}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
