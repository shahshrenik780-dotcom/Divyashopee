
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Divya shopee - Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        header { margin-bottom: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .btn { display: block; background: #25d366; color: white; padding: 10px; text-decoration: none; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <header><h1>Divya shopee Catalog</h1></header>
    <div class="product-grid" id="catalog">
        <!-- Products will load here automatically -->
    </div>

    <script>
        // Aapka Sheet link ka ID yahan hai
        const sheetId = '1PDHNxST-LElVwOmtpmnBeF6z1AAPifzEF_sbNpAabdA';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        fetch(url).then(res => res.text()).then(text => {
            const data = JSON.parse(text.substr(47).slice(0, -2));
            const container = document.getElementById('catalog');
            
            data.table.rows.forEach(row => {
                const name = row.c[0].v;
                const price = row.c[2].v;
                const photo = row.c[5].v;
                
                container.innerHTML += `
                    <div class="card">
                        <img src="${photo}" alt="${name}">
                        <h3>${name}</h3>
                        <p>Price: ₹${price}</p>
                        <a href="https://wa.me/919998366986?text=I want to buy ${name}" class="btn">Order on WhatsApp</a>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
